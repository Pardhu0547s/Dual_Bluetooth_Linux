app-id: org.dualbt.DualAudioHub
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.flutter
command: dual_bt_app
finish-args:
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --share=network
  - --talk-name=org.bluez
modules:
  - name: dual_bt_app
    buildsystem: simple
    build-commands:
      - flutter build linux --release
      - cp -r build/linux/x64/release/bundle/* /app/
      - install -D flatpak/org.dualbt.DualAudioHub.desktop /app/share/applications/org.dualbt.DualAudioHub.desktop
      - install -D flatpak/org.dualbt.DualAudioHub.metainfo.xml /app/share/metainfo/org.dualbt.DualAudioHub.metainfo.xml
    sources:
      - type: dir
        path: ..
